kind: pipeline
type: docker
name: react-local-deploy

platform:
  os: linux
  arch: arm64

steps:
  - name: build-and-deploy
    image: node:22-alpine
    volumes:
      - name: production-web-root
        path: /mnt/target # Use a clean internal path to avoid confusion
    commands:
      # Install dependencies
      - npm ci
      # Run compilation build
      - npm run build
      # Clear old build artifacts on the host
      - rm -rf /mnt/target/*
      # Copy static assets directly to your shared host volume
      - cp -r dist/* /mnt/target/

volumes:
  - name: production-web-root
    host:
      # This points to the runner's /build/projectuntangle directory
      path: /build/projectuntangle 

trigger:
  branch:
    - main
  event:
    - push
