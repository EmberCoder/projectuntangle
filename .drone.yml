kind: pipeline
type: docker
name: react-local-deploy

platform:
  os: linux
  arch: arm64

steps:
  - name: build-and-deploy
    image: node:22-alpine
    environment:
      VITE_FIREBASE_API_KEY:
        from_secret: VITE_FIREBASE_API_KEY
      VITE_FIREBASE_AUTH_DOMAIN:
        from_secret: VITE_FIREBASE_AUTH_DOMAIN
      VITE_FIREBASE_PROJECT_ID:
        from_secret: VITE_FIREBASE_PROJECT_ID
      VITE_FIREBASE_STORAGE_BUCKET:
        from_secret: VITE_FIREBASE_STORAGE_BUCKET
      VITE_FIREBASE_MESSAGING_SENDER_ID:
        from_secret: VITE_FIREBASE_MESSAGING_SENDER_ID
      VITE_FIREBASE_APP_ID:
        from_secret: VITE_FIREBASE_APP_ID
      VITE_FIREBASE_MEASUREMENT_ID:
        from_secret: VITE_FIREBASE_MEASUREMENT_ID
    volumes:
      - name: production-web-root
        path: /mnt/target # Use a clean internal path to avoid confusion
    commands:
      # Install dependencies
      - npm ci
      # Run compilation build with Firebase config injected from Drone secrets
      - npm run build
      # Clear old build artifacts on the host
      - rm -rf /mnt/target/*
      # Copy static assets directly to your shared host volume
      - cp -r dist/* /mnt/target/
      - ls -la /mnt/target # List contents to verify deployment
      - echo "Deployment completed successfully."

volumes:
  - name: production-web-root
    host:
      # This points to the runner's /build/projectuntangle directory
      path: /build/projectuntangle 

trigger:
  branch:
    - main
  event:
    - push
